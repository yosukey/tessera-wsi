    <!--
      Web fonts are self-hosted via @fontsource/inter and
      @fontsource/noto-sans-jp; see src/styles/fonts.css. fonts.googleapis.com
      is not loaded at runtime — Google Fonts returns content-negotiated CSS
      that can't be pinned with Subresource Integrity, so depending on it
      would leave the app at the CDN's mercy. System-font fallbacks remain
      in src/styles/tokens.css for the first paint while @fontsource swaps
      in the web font.
    -->
