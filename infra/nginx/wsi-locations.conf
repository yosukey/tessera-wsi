# =====================================================================
# Tessera - nginx location snippet (reusable across server blocks)
#
# Install path: /etc/nginx/snippets/wsi-locations.conf
#   sudo cp infra/nginx/wsi-locations.conf /etc/nginx/snippets/wsi-locations.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pull it into a `server { ... }` block with:
#   include /etc/nginx/snippets/wsi-locations.conf;
#
# This file holds ONLY the `location` blocks that proxy to the Tessera
# app/sync upstreams. It is meant to be `include`d from inside a server
# block (see infra/nginx/wsi.conf). It deliberately does NOT define the
# surrounding http-context pieces those locations depend on; the
# including config must provide them in the enclosing http {} context:
#
#   - upstreams        : wsi_app, wsi_sync
#   - rate-limit zones : wsi_admin_login, wsi_app_login, wsi_admin_login_net,
#                        wsi_app_login_net, wsi_api, wsi_sync_ws,
#                        wsi_slide_detail, wsi_page_reads, wsi_sync_peek, wsi_spa,
#                        wsi_dzi_uncached, wsi_dzi_authed
#   - proxy cache paths: wsi_dzi_cache, wsi_authz_cache, wsi_static_cache
#                        (keys_zone names)
#   - map/geo vars     : $wsi_xfp, $wsi_cf_connecting_ip, $wsi_cf_access_jwt,
#                        $connection_upgrade, $wsi_rl_key, $wsi_auth_nocache,
#                        $wsi_authz_nocache, $wsi_authz_object,
#                        $wsi_dzi_unversioned, $wsi_dzi_tile_cache_control,
#                        $wsi_dzi_uncached_key, $wsi_dzi_authed_key
#
# Keeping the locations here lets a second site (e.g. a TLS server block,
# or an alternate vhost) reuse the exact same routing without copy/paste.
# =====================================================================

# ---- Admin login: rate-limited to slow down brute force ----
location = /api/admin/login {
    limit_req zone=wsi_admin_login burst=5 nodelay;
    # Per IPv6 /64 on top (no-op for IPv4): rotating through the /64 does
    # not buy a fresh budget per address. burst=10 lets a staff room on
    # one segment sign in at once; see wsi_admin_login_net in wsi.conf.
    limit_req zone=wsi_admin_login_net burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# The two-factor code step (/api/admin/login/mfa) deliberately has no
# location of its own and runs under the general /api/admin/ limit: it is
# reachable only with a token the password step issues, and the app counts
# its codes against the account's database-backed lockout and the per-IP
# throttle. Sharing the tight zone above would make each two-factor sign-in
# cost two of its requests, halving how many staff behind one address can
# sign in at once.

# ---- App-access login (LDAP / basic form; the Google start and callback
# are GETs under the general wsi_api limit): same
# brute-force surface as admin login, so the same tight zone applies.
location = /api/auth/login {
    limit_req zone=wsi_app_login burst=5 nodelay;
    # Per IPv6 /64 on top, as for the admin login: burst=100 so a class whose
    # students each have their own address in one campus /64 can sign in at
    # the start of a lesson (wsi_app_login_net in wsi.conf).
    limit_req zone=wsi_app_login_net burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Live-sync WebSocket (presenter / follower / discovery) ----
# Goes to the single-worker wsi-sync upstream so room state is shared
# across all peers in a session. WebSocket upgrade headers are set
# explicitly here; the long proxy timeouts let an idle session sit
# quietly on the app-level ping/pong without nginx tearing it down.
location ^~ /api/sync/ws/ {
    # Throttle the UPGRADE request rate per IP (this applies only to the
    # initial handshake, not to frames on an established socket) so a client
    # can't flood WS-upgrade attempts — each upgrade burns a threadpool slot
    # plus up to three auth checks in _ws_guard, and (in basic mode) a pbkdf2
    # verify. Its own zone, sized for a whole class behind one NAT address
    # reconnecting at once (see wsi_sync_ws in wsi.conf), so a class neither
    # trips it nor eats the general /api/ budget its pages also need.
    limit_req zone=wsi_sync_ws burst=400 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_sync;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- Live-sync discovery WebSocket ----
location = /api/sync/discovery {
    # Same WS-upgrade throttle (and zone) as /api/sync/ws/ above, handshake
    # only: the index page's discovery socket reconnects alongside the class's
    # follower sockets.
    limit_req zone=wsi_sync_ws burst=400 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_sync;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- Live-sync REST (session peek — app_auth gated) ----
location ^~ /api/sync/ {
    # Metered like every other proxied API location. This upstream is a
    # deliberately single-worker uvicorn holding all live-sync rooms in
    # memory (see wsi_sync in wsi.conf), so an unmetered flood of cheap
    # peek requests here degrades or stalls live sync for an entire
    # in-progress class. The WS handshakes to the same upstream are limited
    # by their own zone; this "^~" prefix wins over "^~ /api/", so without an explicit
    # limit_req these REST siblings would inherit no limit at all rather than
    # that location's. burst matches the interactive /api/ tier they would
    # otherwise have inherited, so the limit does not also tighten them
    # relative to the rest of the API.
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_sync;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;

    # The session peek itself has a zone of its own (wsi_sync_peek in
    # wsi.conf): every follower of a class sends it at the same moment, as
    # they open the shared link. Nested, as under `^~ /api/slides/`, so the
    # prefix match above still wins over the server's regex locations. Session
    # ids are secrets.token_urlsafe(16): 22 characters of [A-Za-z0-9_-].
    location ~ "^/api/sync/sessions/[A-Za-z0-9_-]{1,64}$" {
        limit_req zone=wsi_sync_peek burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://wsi_sync;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wsi_xfp;
        proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    }
}

# ---- Live-sync admin REST (create / list / end — staff JWT gated) ----
# Must come BEFORE the generic /api/admin/ block because nginx picks
# the longest "^~" prefix; declaring it first keeps the file readable.
location ^~ /api/admin/sync/ {
    # Same metering rationale as /api/sync/ above: staff auth bounds who may
    # succeed, not how many requests reach the single-worker sync process.
    # Matches the /api/admin/ tier this would otherwise have inherited; the
    # dashboard's session panel polls here every 8 s (AdminSyncSessionsSection),
    # well inside the 120 r/min zone rate.
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_sync;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Tour asset upload (images, audio, PDF — ~2.5 MiB) ----
# The global client_max_body_size of 2m is too small for tour assets, so
# raise the limit here to 3m: the app-level TOUR_ASSET_MAX_BYTES default is
# 2.5 MiB, and the extra headroom covers multipart/form-data overhead so a
# full-size file isn't rejected at the edge before the app sees it. A raised
# TOUR_ASSET_MAX_BYTES in wsi.env raises this line in the installed copy
# (install.sh's apply_tour_asset_body_cap); leave the 3m here as is. The
# pattern uses a regex to cover the parameterised path
# /api/admin/tours/<id>/assets/upload without also capturing unrelated
# /api/admin/tours* routes. The generic /api/admin/ block is a plain
# prefix (not ^~), so regex locations are still evaluated and this regex
# takes priority over it for the path it matches.
location ~ ^/api/admin/tours/[0-9]+/assets/upload$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    client_body_timeout 120s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Tour step writes (one step's annotations — up to ~3.5 MiB) ----
# Creating a step (POST …/steps, also the editor's Duplicate) and saving one
# (PATCH …/steps/<id>) send all of its annotations in one body. A step may
# hold schemas._MAX_STEP_FREEHAND_POINTS (50,000) freehand vertices — ~2.5 MiB
# of JSON at full float precision — plus 1000 pins, 1000 shapes and a 64 KiB
# description, past the server-level 2m cap. 4m covers that and matches the
# create route's per-field form limit (admin_tours._STEP_FORM_MAX_PART). Only
# the bare step paths match: reorder (…/steps/reorder) and the one-item
# appends (…/steps/<id>/pins|shapes) keep the default. DELETE of a step lands
# here too, which is harmless (bodiless, same upstream).
location ~ ^/api/admin/tours/[0-9]+/steps(/[0-9]+)?$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 4m;
    client_body_timeout 120s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Viewer branding image uploads (logo / header backgrounds — 2 MiB) ----
# The logo, always-on header background and seasonal-background slot image
# uploads each accept up to 2 MiB in the app (_LOGO_MAX_BYTES,
# _HEADER_DEFAULT_MAX_BYTES, _SEASONAL_BG_MAX_BYTES). Under the generic
# /api/admin/ block they would inherit the server-level 2m cap, so a file just
# under the app limit plus its multipart/form-data framing would 413 at the edge.
# 3m gives the same headroom as the tour-asset location above. Regex (not a
# prefix) for the same reason: the generic /api/admin/ block is a plain
# prefix, so this takes priority for exactly these paths. The DELETE twins of
# these paths land here too, which is harmless (bodiless, same upstream).
location ~ ^/api/admin/viewer/(settings/(logo|header-default-background)|seasonal-backgrounds/[0-9]+/image)$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    client_body_timeout 120s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- WSI slide upload (large body, no buffering) ----
# Use an exact-match location ONLY for the upload endpoint. A broader
# `^~ /api/admin/slides/` prefix is unsafe here because of a documented
# nginx behavior: when a `^~ /foo/` location uses proxy_pass, nginx
# auto-301s `GET /foo` (no trailing slash) to `/foo/`. Combined with
# Starlette's `redirect_slashes` (which 307s back to `/foo`), that
# produces an infinite redirect loop on `GET /api/admin/slides`. Pinning
# the streaming config to the exact upload path lets every other
# /api/admin/slides* request fall through to the generic /api/admin/
# block below, which is unaffected.
# https://nginx.org/en/docs/http/ngx_http_core_module.html#location
location = /api/admin/slides/upload {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    # The app's WSI_MAX_UPLOAD_BYTES default (8 GiB) plus 1 MiB for the
    # multipart framing around the file: at exactly 8g a file just under the
    # app's cap would pass the dashboard and app checks but 413 here. Don't
    # edit it here to allow bigger slides: raise WSI_MAX_UPLOAD_BYTES in
    # /etc/wsi/wsi.env and re-run install.sh, which rewrites this line and the replace location's
    # in the installed copy to fit (apply_upload_body_cap; QUICKSTART §6.5).
    client_max_body_size 8193m;
    # Override the tight server-level timeouts: an 8 GiB upload over a
    # slow link can legitimately take many minutes. 10 minutes for the
    # body plus matching proxy timeouts mirrors the upstream Uvicorn /
    # Starlette defaults for streaming uploads.
    client_body_timeout 600s;
    send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- WSI slide replace (large body, no buffering) ----
# The replace endpoint /api/admin/slides/<id>/wsi serves the same multi-GB
# WSI files as /api/admin/slides/upload, so it needs the same body-size
# cap, streaming buffering, and extended timeouts. Without this regex
# location it would fall through to the generic /api/admin/ block and
# inherit the server-level `client_max_body_size 2m`, capping replacements
# at 2 MiB. The generic /api/admin/ block is a plain prefix (not `^~`), so
# regex locations are still evaluated and this regex takes priority for the
# path it matches.
location ~ ^/api/admin/slides/[0-9]+/wsi$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    # Sized by install.sh from WSI_MAX_UPLOAD_BYTES, as for the upload above.
    client_max_body_size 8193m;
    client_body_timeout 600s;
    send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Backup restore upload (large body, no buffering) ----
# Same shape as /api/admin/slides/upload above. The actual size cap is
# enforced by the app (BACKUP_MAX_UPLOAD_BYTES), so nginx is configured
# to be permissive (`client_max_body_size 0` = no limit) and let the
# backend stream the body to disk and reject overruns. This keeps the
# cap operator-tunable from a single place. The app checks the admin
# token before it reads any of the body (main._AdminUploadPreauthMiddleware),
# so an unauthenticated client cannot use the open cap to fill the disk.
location = /api/admin/restore {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 0;
    client_body_timeout 600s;
    send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Slide import bundle upload (large body, no buffering) ----
# A per-slide export bundle carries the WSI files themselves, so it is as large
# as a restore archive. Without this location the import falls through to the
# generic /api/admin/ block and inherits the server-level 2m body cap and 60s
# timeouts: every real bundle 413s, and a small one whose staging takes over a
# minute 504s. Same shape as /api/admin/restore: the size cap is the app's
# (the bundle is streamed through the same BACKUP_MAX_UPLOAD_BYTES-capped
# path), and the app authenticates the request before reading the body.
location = /api/admin/slides/import {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 0;
    client_body_timeout 600s;
    send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Original WSI download (large response, no buffering) ----
# GET /api/admin/slides/{id}/download serves the original scan, up to the 8 GiB
# upload cap. Left to the generic `location /api/admin/` it would be buffered
# to disk (proxy_buffering on) and cut off by the 60 s timeouts mid-transfer
# on a slow link. Same treatment as the export / backup downloads below.
# Authorization is handled by the app — either an admin Bearer header or a
# short-lived `?t=` token issued by POST .../download_url. The access log
# masks that token on all three download routes ($wsi_log_request in wsi.conf).
location ~ ^/api/admin/slides/[0-9]+/download$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    proxy_buffering off;
    proxy_read_timeout 600s;
    send_timeout 600s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Slide export bundle download (large response, no buffering) ----
# Same reasoning as the backup download below: a bundle can be many GB, and
# with proxy_buffering on nginx would spool it to disk before sending it.
location ~ ^/api/admin/slides/export/[^/]+/download$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    proxy_buffering off;
    proxy_read_timeout 600s;
    send_timeout 600s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Backup archive download (large response, no buffering) ----
# The archive can be many GB; with the default proxy_buffering=on nginx
# would spool the whole response to /var/lib/nginx/proxy before sending
# it to the client. proxy_buffering off streams it through. Authorization
# is handled by the app — either an admin Bearer header or a short-lived
# `?t=` token issued by /download_url (masked in the access log, see above).
location ~ ^/api/admin/backup/[^/]+/download$ {
    limit_req zone=wsi_api burst=20 nodelay;
    limit_req_status 429;
    proxy_buffering off;
    proxy_read_timeout 600s;
    send_timeout 600s;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Admin API: JWT-gated by the app. ----
# This MUST be a plain prefix (no `^~`): a `^~` longest-prefix match tells
# nginx to skip regex location evaluation entirely, which would shadow the
# regex locations above (tour asset and branding image uploads, WSI replace,
# WSI, export and backup downloads) and silently subject them to the server-level
# 2m body cap / 60s timeouts. As a plain prefix it still wins as the longest match for
# generic admin paths, but lets the regexes be evaluated for the paths they
# target. The more specific `^~ /api/admin/sync/` and `= /api/admin/login`
# locations continue to take precedence over this block.
location /api/admin/ {
    # burst=40: the admin dashboard fires several /api/admin/* requests on
    # load (slide list, settings, analytics, history), so the burst is sized
    # to absorb a page load plus a few reloads without tripping 429. The
    # underlying zone refills at 120 r/min (see wsi.conf).
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Public slide reads (/api/slides/<public_id>[/...]) ----
#
# The same proxying and wsi_api metering as `^~ /api/` below, except for the
# slide detail read itself (the nested location), which has a zone of its own:
# every live-sync follower requests it at the same instant when the presenter
# switches slides, and a class behind one NAT address would blow through the
# wsi_api burst (see wsi_slide_detail in wsi.conf). Nested, not a sibling: the
# `^~` prefix win skips server-level regex locations, while a regex nested in
# the matched prefix location is still evaluated. The list, GET /api/slides
# (no trailing slash), is not matched here; see the exact location below.
location ^~ /api/slides/ {
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;

    # public_id tokens are [A-Za-z0-9_-]{1,32} (admin_helpers.PUBLIC_ID_RE).
    location ~ "^/api/slides/[A-Za-z0-9_-]{1,32}$" {
        limit_req zone=wsi_slide_detail burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://wsi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wsi_xfp;
        proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    }
}

# The slide list, GET /api/slides. Without an exact location, the proxy_pass
# prefix location above makes nginx answer this slash-less URI with a 301 onto
# `http://<host>/api/slides/` — plain http behind the TLS-terminating tunnel,
# which the page's CSP (connect-src 'self') blocks, leaving the index page on
# its catalog-load error. Same metering as `^~ /api/` below.
location = /api/slides {
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Public API (slide list / tours) ----
location ^~ /api/ {
    # burst=40: a single public page load fires several /api/ requests at
    # once (slides, facets, tours, viewer settings, auth state, analytics
    # beacon). burst=40 absorbs that load plus a few rapid reloads instead of
    # returning 429; the zone refills at 120 r/min (see wsi.conf). The large
    # upload/restore/backup locations above intentionally keep burst=20 —
    # they are single-shot operations, not bursty interactive traffic.
    limit_req zone=wsi_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;

    # What a visitor's browser reads to open a page: a tour (the tour page's
    # one data request, and it has no retry), and the two small reads every
    # public page makes first (the sign-in state and the site settings). A
    # class behind one NAT address opening the same tour link at the start of
    # a lesson is 30 students x these three at once, which is more than the
    # wsi_api burst above even before the page's analytics beacons; they have
    # a zone of their own (wsi_page_reads in wsi.conf), not the slide detail's:
    # on a presenter's switch each follower sends the slide read and the
    # settings read, and sharing a burst would starve the slide reads. The beacons
    # stay in wsi_api: they are the
    # unauthenticated writes, and best-effort. Nested, like the slide detail
    # under `^~ /api/slides/`, because the `^~` prefix win skips server-level
    # regex locations. Tour ids are public_id tokens, [A-Za-z0-9_-]{1,32}.
    location ~ "^/api/(tours/[A-Za-z0-9_-]{1,32}|viewer/settings|auth/state)$" {
        limit_req zone=wsi_page_reads burst=400 nodelay;
        limit_req_status 429;
        proxy_pass http://wsi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wsi_xfp;
        proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    }
}

# ---- Internal authorization probe for the edge-cached read surfaces ----
#
# This is what lets /dzi/ tiles, /thumbs/ thumbnails and /assets/ tour
# attachments be SHARED across every authenticated user instead of fragmenting
# per session cookie (or, for /thumbs/ + /assets/, not being cached at all).
# Each of those locations runs this as an `auth_request` subrequest and
# consults ONLY its status code (2xx = allow, 401/403 = deny; anything else
# makes auth_request answer 500). Enforcing the gate here — at the edge,
# before a cache HIT is served — means their cache keys need not include the
# cookie, so all users share one entry.
#
# The subrequest is proxied to /api/edge-authz, which returns 204 whenever the
# app's own auth middleware admitted it (valid session cookie / admin bearer /
# CF-Access JWT / an exemption / mode=none) and inherits the middleware's 401
# otherwise. For a /dzi/ URI (passed as X-Original-URI) it ALSO applies the
# per-slide publish gate — the slide must exist and be published, or the
# request must carry a staff bearer (draft preview) — and answers 403
# otherwise: a cache HIT never reaches the app's /dzi/ routes, so without this
# a tile cached while a slide was public stays servable for the tile cache's
# 30 days after the slide was unpublished or deleted. The client gets that
# 401 / 403 straight from nginx (there is no error_page for these locations);
# for a tile or descriptor that is just a failed fetch in the viewer.
#
# An ALLOW verdict is cached per (client IP, session cookie, slide) for a short
# TTL in its own short-lived zone (wsi_authz_cache, declared next to the tile
# zone in wsi.conf) — so the app is consulted at most once per user per slide
# per TTL, not once per tile. That TTL (60 s below) is therefore how long an
# unpublish / delete can take to reach users who already had the slide open.
# It must not share the tile zone: the key folds in the cookie, address and
# slide, so entries would pile up there for the tiles' 30 days and evict real
# tiles. Denials (401/403) are not cached at all, so a junk-cookie flood leaves
# nothing in this zone and cannot crowd legitimate users' verdicts out of it. Admin (Authorization bearer) and
# CF-Access (JWT) requests bypass this cache so their verdict is always live
# (an anonymous no-cookie request and an admin-bearer request would otherwise
# share the empty-cookie key).
location = /_wsi_authz {
    internal;
    proxy_pass http://wsi_app/api/edge-authz;
    # The auth subrequest carries no body; strip it (and the length header) so
    # a buffered client body can never stall the gate.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # The client's original URI (in this subrequest $request_uri is still the
    # main request's raw URI; $uri would be "/_wsi_authz"), so /api/edge-authz
    # can tell which slide a /dzi/ request is for.
    proxy_set_header X-Original-URI $request_uri;
    proxy_cache wsi_authz_cache;
    # Key the cached app-access verdict on BOTH the session cookie AND the
    # resolved client IP ($wsi_rl_key = trusted Cf-Connecting-IP or $remote_addr).
    # The verdict is derived from the full app middleware stack including
    # ip_filter_middleware, which 403s by client IP. Without the IP in the key,
    # a mode=none deployment (every client cookie-less → shared empty-cookie
    # key) would reuse one client's 204 verdict for every other IP, so an
    # IP-filter-denied client would ride an allowed client's cached verdict and
    # be served cached tiles/thumbs/assets for the whole TTL. The IP stays OUT
    # of the tile/thumb/asset CONTENT keys below, so the shared content cache is
    # preserved — auth_request runs before a HIT is served, so an IP-aware
    # verdict here is sufficient to gate cached content per IP.
    #
    # The cookie field is the whole Cookie header, not $cookie_wsi_session. The
    # app and nginx disagree about a name that appears twice ("wsi_session=;
    # wsi_session=<valid>"): nginx's $cookie_* variable is the FIRST one, the
    # app (Starlette) the LAST. Keyed on the first, the app's allow for the
    # valid second cookie would have been stored under the key a cookie-less
    # client at the same address uses, and served to it for the TTL. Keyed on
    # the header the app judged, a verdict can only be replayed for that exact
    # header.
    #
    # The scheme, the Host and the X-Forwarded-For chain the client arrived with
    # are in the key as well: the app's LAN exemptions (WSI_BREAKGLASS_NOAUTH,
    # the dashboard's LAN-direct mode) judge every hop in the chain, only a
    # plaintext listener, and (LAN-direct "ip" level) a bare private-IP Host, so
    # a verdict is a function of all three. Without them, behind a further proxy
    # that appends its client's address, a LAN client's cached allow would be
    # replayed for an Internet client that reaches nginx through that same proxy
    # (same $wsi_rl_key, same empty cookie) for the whole TTL.
    # $http_x_forwarded_for is the chain as it reaches nginx, i.e. what the proxy
    # added; nginx's own hop ($remote_addr) is $wsi_rl_key.
    #
    # $wsi_authz_object (map in wsi.conf) adds the slide for a /dzi/ URI
    # ("dzi:<public_id>"; "" for /thumbs/ and /assets/): the app's verdict
    # depends on which slide is asked for, so an allow for a published slide
    # must never be replayed for a draft or deleted one. It goes LAST: it holds
    # no "|". (Host, X-Forwarded-For and Cookie are client-sent text that may
    # contain "|", and sit side by side, so ("a|b", "c") and ("a", "b|c") make
    # the same key; but a hit also needs the same $wsi_rl_key, and a collision
    # means the Cookie header of the request that earned the verdict carried
    # bytes someone else chose -- not a thing a client can arrange for another's.)
    proxy_cache_key "authz|$wsi_rl_key|$wsi_xfp|$host|$http_x_forwarded_for|$http_cookie|$wsi_authz_object";
    # Only ALLOW verdicts are stored. No proxy_cache_valid for 401/403 means
    # nginx does not store them (the app sends no caching headers on its 401 /
    # 403), so a denial is re-checked on the next request: a login, or a
    # publish, takes effect at once. The allow TTL is the revocation latency
    # for an unpublish / delete at the edge (plus up to
    # WSI_SLIDE_META_GEN_CHECK_SECONDS for the app's other workers to
    # see it) — keep it short.
    proxy_cache_valid 200 204 60s;
    # $wsi_authz_nocache: see wsi.conf — only a verdict earned by the cookie
    # alone is cached; any request carrying an Authorization header is checked
    # live (the app's cookie branch keeps that cheap for a Basic browser).
    proxy_cache_bypass $wsi_auth_nocache $wsi_authz_nocache $wsi_cf_access_jwt;
    proxy_no_cache    $wsi_auth_nocache $wsi_authz_nocache $wsi_cf_access_jwt;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Deep Zoom tiles (cached heavily, shared across authenticated users) ----
#
# The cache key is the tile URL ALONE — it deliberately does NOT include the
# session cookie, so 100+ users viewing the same slide share ONE cache entry
# per tile (the whole point: cold tile generation happens once, everyone else
# gets a 1–5 ms HIT). The app-access gate AND the per-slide publish gate are
# preserved without the cookie by the `auth_request` below: nginx authorizes
# each request against the cached /_wsi_authz verdict for (client, slide)
# before serving, so a HIT can never bypass auth or outlive an unpublish /
# delete by more than that verdict's 60 s TTL.
#
# Tile URLs carry the slide's WSI content generation, `?v=N` (the viewer opens
# `/dzi/<id>.dzi?v=N` and OpenSeadragon copies the query onto every tile URL),
# and the key includes it: a WSI replace bumps N, so viewers move onto keys no
# old tile was stored under rather than mixing old and new tiles under one URL
# for 30 days. The app 404s (uncacheably) any `v` that is not current, so one
# key only ever holds one generation; a request with no `v` (a script or a
# crafted request) is served but never stored ($wsi_dzi_unversioned).
#
# Draft (unpublished) tiles and admin/CF responses are still kept OUT of this
# shared cache by proxy_no_cache/$wsi_auth_nocache below (any Authorization
# except HTTP Basic), so the shared key only ever holds published,
# publicly-authorized tiles.
location ^~ /dzi/ {
    # Refuse non-canonical request paths before they can reach the cache.
    # The cache key below is built from nginx's NORMALISED $uri ("//" merged,
    # "./" and "../" resolved, %XX decoded), but proxy_pass without a URI
    # forwards the client's RAW path. The two disagree for e.g.
    # "//dzi/<id>_files/12/3_4.jpeg": the app sees a path no route matches and
    # answers with the SPA's index.html (200), which would then be cached for
    # 30 days under the real tile's key — every viewer gets a broken tile.
    # Any "%" is refused too, not just the encoded separators: the per-slide
    # authz verdict is keyed on the RAW $request_uri (see $wsi_authz_object in
    # wsi.conf), so a percent-encoded spelling ("/%64zi/<id>_files/...") would
    # otherwise reach a cached tile under a verdict computed for a different
    # (non-/dzi/) object. A viewer never percent-encodes anything here (tokens
    # are [A-Za-z0-9_-]), so reject these forms outright.
    if ($request_uri ~ "^[^?]*(//|/\.\.?(/|\?|$)|%)") {
        return 400;
    }
    # Meter the requests that reach the app whatever the cache holds — those
    # with no ?v= — per client (wsi_dzi_uncached in wsi.conf). Every versioned
    # request has an empty key there and is not counted, so current viewers,
    # cache HIT or cold MISS, are never slowed. A script or other non-SPA
    # caller gets its first ~100 tiles at once; the rest of a full HiDPI
    # screen (up to ~380) queue and come in at the zone's 10/s instead of
    # failing, and only past 400 queued is it answered 429. Inherited by the
    # nested .dzi / .szi locations (neither declares a limit_req of its own).
    limit_req zone=wsi_dzi_uncached burst=400 delay=100;
    # And those that carry a non-Basic Authorization header, which are kept out
    # of the cache the same way (see wsi_dzi_authed in wsi.conf).
    limit_req zone=wsi_dzi_authed burst=600 nodelay;
    limit_req_status 429;
    # Enforce the app-access + per-slide gate at the edge (see /_wsi_authz
    # above). A denied request never reaches the cache or the tile generator.
    auth_request /_wsi_authz;
    proxy_cache wsi_dzi_cache;
    # Key on the path ($uri, not $request_uri) plus ONLY the whitelisted `v`
    # generation arg (the /thumbs/ pattern): folding every other query arg out
    # blocks a `?r=<random>` cache-flooding spray that would otherwise mint
    # unbounded distinct entries and evict hot tiles from the shared 50 GB
    # cache. A `?v=<random>` spray mints nothing either: the app answers any
    # non-current, non-canonical or duplicated `v` with an uncacheable 404.
    proxy_cache_key "$scheme$proxy_host$uri?v=$arg_v";
    proxy_cache_valid 200 302 30d;
    # No `proxy_cache_valid 404`: a 404 is never stored. The app 404s a tile
    # coordinate outside the pyramid (and one that is not canonical) without
    # marking it uncacheable, so with a 404 validity each distinct made-up
    # coordinate under a real slide and its current `v` wrote a file that the
    # tile zone kept for its whole 30-day inactive window.
    proxy_cache_lock on;
    # Bound how long concurrent requests for the same key wait on the
    # in-flight origin fetch, and how long a single locking request may
    # hold the lock. Without these, a stuck upstream tile generation
    # could pin every queued client until the default 5s elapses with
    # no upper bound on the locking request itself.
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;
    proxy_cache_use_stale error timeout updating;
    # The app sends Cache-Control: no-cache for ETag-based browser revalidation.
    # Ignore it so nginx writes tiles to disk; the header is still forwarded to
    # the browser, preserving ETag revalidation at the browser level.
    # X-Accel-Expires is deliberately NOT ignored: the app sends
    # "X-Accel-Expires: 0" on an unversioned response and on a stale-`v` 404,
    # so neither is stored even by a hand-edited config without the `v` key
    # and $wsi_dzi_unversioned below (nginx strips the header before it reaches
    # the browser).
    proxy_ignore_headers Cache-Control;
    # Admin draft previews ride through with an Authorization Bearer
    # header so the upstream's is_published gate lets them through.
    # Bypass the public cache for those requests on both directions:
    #   - $wsi_auth_nocache in proxy_cache_bypass: don't serve a
    #     cached anonymous response back to an authenticated admin.
    #   - $wsi_auth_nocache in proxy_no_cache: don't write the
    #     admin-only draft response into the public cache, where a
    #     subsequent anonymous visitor could retrieve it for 30 days.
    # (HTTP Basic is exempt — see the map in wsi.conf: it never unlocks a
    # draft, so a Basic-mode browser shares the cache like a cookie user.)
    #
    # $wsi_cf_access_jwt gets the same treatment. The tile cache key is the
    # cookie-less URL, so a CF-authenticated 200 would otherwise be written
    # under the shared key and then served as a cache HIT to an anonymous
    # client that never passed the app's own basic/ldap gate — the documented
    # "CF + LAN-direct" topology. no_cache keeps CF-authenticated responses out
    # of the shared cache; bypass keeps a CF user from being handed a stale
    # anonymous entry. (Ordinary session-cookie users are authorized by the
    # auth_request gate above, so their tiles are safe to share.)
    #
    # $wsi_dzi_unversioned (map in wsi.conf) is set when the request has no
    # (or an empty) `v`: a script's tile is served from the app, never
    # looked up in or written to the shared cache, since the bare key could
    # otherwise hold any generation's bytes.
    proxy_cache_bypass $wsi_auth_nocache $wsi_cf_access_jwt $wsi_dzi_unversioned;
    proxy_no_cache    $wsi_auth_nocache $wsi_cf_access_jwt $wsi_dzi_unversioned;
    # The tiles' browser caching ($wsi_dzi_tile_cache_control in wsi.conf)
    # replaces whatever Cache-Control the response carries — including the one
    # stored with an already-cached tile, so a change of policy takes effect
    # without clearing the cache. proxy_hide_header is inherited, so the
    # nested .dzi / .szi locations below pass the app's own header back
    # through (proxy_pass_header).
    proxy_hide_header Cache-Control;
    add_header Cache-Control $wsi_dzi_tile_cache_control always;
    add_header X-Cache-Status $upstream_cache_status;
    # nginx add_header is NOT additive: declaring X-Cache-Status here cancels
    # inheritance of the server-level security headers, so repeat the static
    # ones. (The CSP is intentionally omitted: it governs document contexts,
    # not image/jpeg tile responses, and is built dynamically in wsi.conf where
    # install.sh injects the LAN-direct host — duplicating it here would drift.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;

    # ---- SZI archives: pass Range through, do NOT cache ----
    #
    # A .szi is a single (up to multi-GB) ZIP the szi-tile-source library
    # reads piecewise via HTTP Range — its very first read is a suffix-range
    # for the ZIP central directory at the end of the file. The parent /dzi/
    # block has proxy_cache ON, and nginx does NOT forward the Range header to
    # the upstream on a cache MISS: it fetches the WHOLE object, stores it, and
    # only then slices out the requested bytes. For a .szi that means every
    # first open pulls the entire archive through the app (measured: a 256 MB
    # archive stalls the client's opening range read ~2 s; an 8 GiB archive
    # scales that to ~minute) AND writes the whole archive into the 50 GB tile
    # cache, evicting real tiles. It also masks the app's own Range/206/304
    # handling in dzi.get_szi (the 304-only-when-no-Range guard never runs).
    #
    # Turning caching off for just .szi restores Range pass-through: the app
    # serves 206 partial content directly (cheap file I/O, even for big
    # archives) and the archive never lands in the shared cache. Regular DZI
    # tiles (/dzi/{id}_files/.../*.jpeg) are unaffected and stay cached/shared.
    #
    # A nested location is used (not a sibling): the parent is `^~ /dzi/`, whose
    # longest-prefix win tells nginx to skip *server-level* regex locations, so
    # a sibling `location ~ \.szi$` would never be considered. A location nested
    # inside the matched prefix location IS still evaluated. auth_request and the
    # security add_headers are repeated because neither is inherited into a
    # location that sets its own add_header (add_header is not additive).
    location ~ "\.szi$" {
        # Non-canonical raw path: see the note on the parent location (an
        # `if` there does not run for a request this nested location takes).
        if ($request_uri ~ "^[^?]*(//|/\.\.?(/|\?|$)|%)") {
            return 400;
        }
        # Same edge app-access + per-slide gate. The archive URL carries `?v=`
        # too, but nothing is cached here, so no key or bypass is involved; the
        # app 404s a stale `v` so szi-tile-source never splices Range reads of
        # a replaced archive into the old one's central directory.
        auth_request /_wsi_authz;
        proxy_cache off;                       # → Range/If-* reach the upstream
        proxy_buffering off;                   # stream, don't spool GBs to disk
        # The app's no-cache, not the tiles' policy: the parent hides
        # Cache-Control to set that, and the hide is inherited.
        proxy_pass_header Cache-Control;
        # Repeat the security headers (see the parent block's note on
        # add_header not being inherited once a location declares its own).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://wsi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wsi_xfp;
        proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    }

    # ---- DZI descriptor (.dzi): versioned key, short TTL + revalidate ----
    #
    # The descriptor URL is `/dzi/<id>.dzi?v=N` and is keyed like the tiles
    # ($uri plus the `v` generation arg; an unversioned request is never
    # stored), so a WSI replace — whose new dimensions / tile count arrive with
    # a new N — never meets the old descriptor at the edge, and an unpublish /
    # delete is enforced per slide by the auth_request verdict.
    #
    # The short TTL + proxy_cache_revalidate are kept as a cheap second line:
    # once stale, nginx revalidates against the app (which enforces the
    # publish gate and emits an ETag), so the descriptor never
    # outlives a change by more than minutes even if a verdict or generation
    # check were missed. The descriptor is tiny, so the extra origin hits are
    # negligible. The tiles themselves stay on the parent's 30-day cache.
    #
    # Nested (not sibling) for the same reason as the .szi block above: the
    # parent's ^~ /dzi/ prefix win skips server-level regex locations. Repeats
    # auth_request/add_header/proxy_pass because a location that sets its own
    # directives does not inherit them (add_header is not additive).
    location ~ "\.dzi$" {
        # Non-canonical raw path: see the note on the parent location (an
        # `if` there does not run for a request this nested location takes).
        if ($request_uri ~ "^[^?]*(//|/\.\.?(/|\?|$)|%)") {
            return 400;
        }
        auth_request /_wsi_authz;
        proxy_cache wsi_dzi_cache;
        # $uri plus only the whitelisted `v` (see the tile note): any other
        # query arg folds out, blocking `?r=<random>` cache flooding.
        proxy_cache_key "$scheme$proxy_host$uri?v=$arg_v";
        proxy_cache_valid 200 302 5m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control;
        # The descriptor keeps the app's no-cache (the parent hides
        # Cache-Control for the tiles' policy, and the hide is inherited): it is
        # what stops an unpublished slide from being reopened.
        proxy_pass_header Cache-Control;
        proxy_cache_bypass $wsi_auth_nocache $wsi_cf_access_jwt $wsi_dzi_unversioned;
        proxy_no_cache    $wsi_auth_nocache $wsi_cf_access_jwt $wsi_dzi_unversioned;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://wsi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wsi_xfp;
        proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
    }
}

# ---- Static slide thumbnails (served by app from /thumbs, cached + shared) ----
#
# Cached and shared across authenticated users exactly like /dzi/: the app
# still serves the files (so filesystem ownership is unchanged), but nginx
# absorbs the classroom burst — a slide-index page load fires one thumbnail
# request per slide, so a whole class hitting the index at once would otherwise
# be one request per student per thumbnail through the app's middleware. The app-access gate is
# preserved by the same auth_request as /dzi/.
#
# Unlike /dzi/ tiles (immutable per URL, 30d TTL), a thumbnail can change or
# disappear under its URL, and the edge check here is app access only — no
# per-slide publish gate as for /dzi/:
#   - a WSI replace regenerates it in place, and the URL's cache-buster
#     (?v=created_at) does NOT change;
#   - unpublishing a slide renames the file to a fresh random token
#     (admin_helpers.rotate_thumb_filename: the token is the only per-slide
#     gate on /thumbs/), and deleting the slide removes it — both so that every
#     URL handed out while the slide was public stops resolving.
# A cached 200 outlives either change for as long as it is fresh — with a 1h
# TTL, an unpublished slide's thumbnail would stay servable for up to an hour.
# So the TTL is 60 s, the window the /_wsi_authz verdict gives an unpublish on
# /dzi/. That costs little: once stale, `proxy_cache_revalidate on` turns the
# refresh into a conditional request on the file's mtime ETag / Last-Modified,
# which StaticFiles answers with a bodiless 304 while the file is unchanged,
# and proxy_cache_lock keeps that to one request per thumbnail per minute
# however many clients ask. A renamed or deleted file answers 404 instead; that
# is not stored (no `proxy_cache_valid 404`), so the expired entry simply stops
# being served, to every request: use_stale is limited to errors and timeouts
# for that reason. infra/nginx-cache.sh can still clear the cache outright.
location ^~ /thumbs/ {
    # Non-canonical raw path: see the note on the /dzi/ location. (Only the
    # encoded separators are refused here, not every "%": this location's
    # authz verdict is not per object, so a raw/normalised mismatch in the
    # name cannot select another object's verdict.)
    if ($request_uri ~ "^[^?]*(//|/\.\.?(/|\?|$)|%2[Ff]|%2[Ee]|%5[Cc])") {
        return 400;
    }
    auth_request /_wsi_authz;
    # Its own zone, not the tile zone (see wsi_static_cache in wsi.conf): the
    # names are the client's to choose, and a flood of junk ones must not be
    # able to evict tiles.
    proxy_cache wsi_static_cache;
    # Key on the path ($uri) ALONE: not the full $request_uri, and not the `v`
    # in thumb URLs (`/thumbs/<name>?v=<created-ts>`) either. `v` is the slide's
    # creation time, which does not change when a thumbnail is replaced (see
    # _serializers.thumb_url), so it buys nothing, and being the client's to
    # set it would let `?v=1`, `?v=2`, ... of one real thumbnail each mint and keep a
    # separate copy. A replaced thumbnail is picked up by the 60 s TTL and the
    # ETag revalidation below.
    proxy_cache_key "$scheme$proxy_host$uri";
    # 60 s, not longer: how long an unpublished / deleted slide's thumbnail
    # stays servable from the cache (see the note above this location).
    proxy_cache_valid 200 60s;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;
    # NOT `updating`: while one request refreshes an expired entry, `updating`
    # hands the others the stale one, and when the refresh finds the file gone
    # (404, which is not stored) the entry is never replaced, so a renamed or
    # deleted file would stay servable to overlapping requests for as long as it
    # was asked for. proxy_cache_lock already keeps a refresh to one upstream
    # request; the others wait for it and get its answer.
    proxy_cache_use_stale error timeout;
    proxy_cache_bypass $wsi_auth_nocache $wsi_cf_access_jwt;
    proxy_no_cache    $wsi_auth_nocache $wsi_cf_access_jwt;
    add_header X-Cache-Status $upstream_cache_status;
    # add_header cancels inherited security headers (see /dzi/ note); repeat them.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Tour assets (markdown images etc.; cached + shared) ----
#
# Same treatment as /thumbs/: an instructor-led tour has every student loading
# the same step's images at once, so sharing one cache entry collapses that
# fan-out to a single origin fetch while the auth_request keeps the gate.
# Newly-uploaded assets get a unique filename (immutable URL) so caching is
# safe; the opt-in "overwrite" upload reuses a name, which the 1h TTL +
# proxy_cache_revalidate bounds. (/thumbs/ has a 60 s TTL instead, because
# unpublishing a slide revokes its thumbnail URL; a deleted asset, like a
# replaced one, can stay servable from the cache for up to this hour.)
location ^~ /assets/ {
    # Non-canonical raw path: see the note on the /dzi/ location.
    if ($request_uri ~ "^[^?]*(//|/\.\.?(/|\?|$)|%2[Ff]|%2[Ee]|%5[Cc])") {
        return 400;
    }
    auth_request /_wsi_authz;
    proxy_cache wsi_static_cache;
    # Key on the path only ($uri, not $request_uri): tour-asset URLs carry no
    # meaningful query, so folding out the query string blocks a `?r=<random>`
    # cache-flooding spray (unbounded distinct keys evicting hot entries) while
    # leaving legitimate hits — which differ only by path — unaffected.
    proxy_cache_key "$scheme$proxy_host$uri";
    proxy_cache_valid 200 1h;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;
    # NOT `updating`: while one request refreshes an expired entry, `updating`
    # hands the others the stale one, and when the refresh finds the file gone
    # (404, which is not stored) the entry is never replaced, so a renamed or
    # deleted file would stay servable to overlapping requests for as long as it
    # was asked for. proxy_cache_lock already keeps a refresh to one upstream
    # request; the others wait for it and get its answer.
    proxy_cache_use_stale error timeout;
    proxy_cache_bypass $wsi_auth_nocache $wsi_cf_access_jwt;
    proxy_no_cache    $wsi_auth_nocache $wsi_cf_access_jwt;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app already sends nosniff on /assets/ responses (together with the
    # attachment + sandbox-CSP headers it puts on non-media files, which pass
    # through untouched); drop its copy so the header is not sent twice.
    proxy_hide_header X-Content-Type-Options;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}

# ---- Everything else: frontend SPA served by the app ----
location / {
    # Generous burst: a cold SPA load pulls the bundles, fonts and header
    # images through here in one go. See the wsi_spa zone comment in wsi.conf.
    limit_req zone=wsi_spa burst=100 nodelay;
    # 429, not nginx's default 503: uptime checks and the SPA read 503 as a
    # backend outage rather than throttling, and 429 carries the retryable
    # semantics every other limited location here already returns.
    limit_req_status 429;
    proxy_pass http://wsi_app;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wsi_xfp;
    proxy_set_header Cf-Connecting-IP                   $wsi_cf_connecting_ip;
    proxy_set_header Cf-Access-Jwt-Assertion            $wsi_cf_access_jwt;
}
