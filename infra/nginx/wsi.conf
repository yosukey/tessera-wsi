# =====================================================================
# Tessera - nginx site config (native Ubuntu deployment)
#
# Install path: /etc/nginx/sites-available/wsi
#   sudo cp infra/nginx/wsi.conf /etc/nginx/sites-available/wsi
#   sudo cp infra/nginx/wsi-locations.conf /etc/nginx/snippets/wsi-locations.conf
#   [ -e /etc/nginx/snippets/wsi-access-log.conf ] || [ -L /etc/nginx/snippets/wsi-access-log.conf ] \
#       || sudo cp infra/nginx/wsi-access-log.conf /etc/nginx/snippets/wsi-access-log.conf
#   sudo ln -sf /etc/nginx/sites-available/wsi /etc/nginx/sites-enabled/wsi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The `location` blocks live in the companion snippet
# infra/nginx/wsi-locations.conf (installed to /etc/nginx/snippets/) and
# are pulled in via `include` from the server block below, so they can be
# reused by other server blocks.
# =====================================================================

# Deep Zoom tile cache. 50 GB on-disk cap, 30 day TTL.
# Ensure /var/cache/nginx/wsi_dzi exists and is owned by the nginx worker
# user (www-data on Ubuntu). The install.sh script takes care of this.
proxy_cache_path /var/cache/nginx/wsi_dzi levels=1:2 keys_zone=wsi_dzi_cache:400m
                 max_size=50g inactive=30d use_temp_path=off;

# Edge app-access verdicts (/_wsi_authz in wsi-locations.conf). A zone of its
# own, NOT the tile zone: its key folds in the session cookie, the client
# address, the forwarded chain and the slide, so one admitted client leaves an
# entry per distinct combination, each good for 60 s only. In the tile zone
# those would sit for the tiles' inactive=30d and LRU-evict real tiles once the
# zone filled. Here the keys_zone size bounds the entry count (and so the disk
# use), and inactive=2m reaps a node shortly after its 60s verdict lapses. Only
# ALLOW verdicts are stored; a denial or a junk cookie leaves nothing behind
# (nginx drops the key of a response it does not store: 20,000 distinct
# uncached misses in a 1 MB zone evicted nothing). Deliberately no max_size=
# token: the cache-size tooling (nginx-cache.sh, install.sh, the admin Server
# Info page) edits and reads the first/every max_size= in this file, which must
# stay the tile zone's. Keep this directive AFTER the tile zone's for the same
# reason (first match wins).
proxy_cache_path /var/cache/nginx/wsi_authz levels=1:2 keys_zone=wsi_authz_cache:4m
                 inactive=2m use_temp_path=off;

# Thumbnails (/thumbs/) and tour attachments (/assets/): a zone of their own.
# What is stored there are real files only: the key is the path (no
# client-chosen query), and a 404 is not stored, so a flood of made-up names
# leaves nothing behind (nginx drops the key of a response it does not store).
# Storing them would let such a flood evict tiles, with a 404 cached for the
# tiles' 30-day inactive time. Kept apart anyway: their entries die
# after 10 minutes unused instead of 30 days, and a zone of their own is full
# only of thumbnails and attachments, which a request re-fetches in
# milliseconds, never of tiles. The keys_zone size bounds the disk use. Like the
# authz zone: no max_size= (the cache-size tooling edits the first one in this
# file, which must stay the tile zone's), declared after the tile zone.
proxy_cache_path /var/cache/nginx/wsi_static levels=1:2 keys_zone=wsi_static_cache:32m
                 inactive=10m use_temp_path=off;

# ---- Cloudflare Tunnel header gating ----
#
# When the app is fronted by Cloudflare Tunnel, cloudflared runs on the
# same host and forwards incoming requests to nginx over loopback. CF
# attaches the following headers to those requests:
#
#   Cf-Connecting-IP                       : real client IP
#   Cf-Access-Jwt-Assertion                : signed JWT (verified by app)
#   Cf-Visitor                             : JSON {"scheme":"https"|"http"} for original edge scheme
#
# A request that *bypasses* the tunnel (e.g. organisation-internal LAN
# direct to nginx) may still carry these header names if an attacker
# sets them — nginx forwards request headers transparently by default.
# To prevent header injection, the geo block below flags loopback peers
# (cloudflared) as trusted and the map blocks substitute "" for any
# header arriving from any other peer. Each location that proxies to
# the app sets these via `proxy_set_header` so the upstream sees the
# scrubbed values, not the raw client headers.
#
# CF also sends Cf-Access-Authenticated-User-Email. It is not covered by the
# JWT signature, and the app never reads it (the CF identity is the verified
# JWT's email claim), so it is neither scrubbed nor relied on here.
geo $cf_hop_trusted {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}

map $cf_hop_trusted $wsi_cf_connecting_ip {
    1 $http_cf_connecting_ip;
    0 "";
}

map $cf_hop_trusted $wsi_cf_access_jwt {
    1 $http_cf_access_jwt_assertion;
    0 "";
}

# Rate-limit / cookie-secure key derived from the trusted Cf-Connecting-IP
# (when present) or the immediate peer otherwise.
#
# Without this, $remote_addr-based rate limiting collapses every CF Tunnel
# user into a single bucket keyed on cloudflared's loopback IP — one
# misbehaving CF user trips the limit for everybody, while a brute-force
# attacker has the entire bucket to themselves. Direct-LAN clients hit the
# fallback ($remote_addr) and stay per-IP limited.
map $wsi_cf_connecting_ip $wsi_rl_key {
    default $wsi_cf_connecting_ip;
    ""      $remote_addr;
}

# The IPv6 /64 that $wsi_rl_key (the same trusted Cf-Connecting-IP or peer
# address) belongs to, as "a:b:c:d::/64"; "" for IPv4. A /64 is what one
# household or one LAN segment is handed, so a single IPv6 client can pick a
# fresh source address from 2^64 at will, and a limit keyed on the address
# alone gives it a fresh budget each time. This keys the per-/64 login caps
# below; every zone still keys on $wsi_rl_key too, so IPv4 is unchanged.
#
# Parses the textual form, which nginx writes ($remote_addr) and Cloudflare
# sends compressed per RFC 5952: the first four groups as written, or — when
# the "::" falls inside them — expanded by how many groups follow it (fewer
# than five after it: the rest of the /64 is zeros). Anything with a "." is
# an IPv4 address (or IPv4-mapped / -embedded) and gets "". Two spellings of
# one /64 that differ only in letter case or leading zeros would make two keys
# (no compliant producer writes either); two /64s never share one.
map $wsi_rl_key $wsi_rl_net64 {
    default                                                               "";
    "~\."                                                                 "";
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"       "$1::/64";
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                    "$1:0::/64";
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4})::([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"   "$1:0:$2::/64";
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                  "$1:0:0::/64";
    "~*^([0-9a-f]{1,4})::([0-9a-f]{1,4}):([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "$1:0:$2:$3::/64";
    "~*^([0-9a-f]{1,4})::([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"             "$1:0:0:$2::/64";
    "~*^([0-9a-f]{1,4})::"                                                "$1:0:0:0::/64";
    "~*^::([0-9a-f]{1,4}):([0-9a-f]{1,4}):([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "0:$1:$2:$3::/64";
    "~*^::([0-9a-f]{1,4}):([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"            "0:0:$1:$2::/64";
    "~*^::([0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                            "0:0:0:$1::/64";
    "~*^::"                                                               "0:0:0:0::/64";
}

# Original edge scheme for the X-Forwarded-Proto header. cloudflared exposes
# the public scheme via Cf-Visitor (JSON like {"scheme":"https"}); without
# decoding it, nginx's $scheme is the cloudflared→nginx hop scheme (always
# http on loopback) and the app's session cookies would be minted without
# the Secure flag for HTTPS-at-edge users.
map $http_cf_visitor $wsi_cf_edge_scheme {
    default                       "";
    "~\"scheme\":\s*\"https\""    "https";
    "~\"scheme\":\s*\"http\""     "http";
}

map $cf_hop_trusted $wsi_cf_edge_scheme_trusted {
    1 $wsi_cf_edge_scheme;
    0 "";
}

map $wsi_cf_edge_scheme_trusted $wsi_xfp {
    default $wsi_cf_edge_scheme_trusted;
    ""      $scheme;
}

# ---- Access log without download tokens ----
#
# The three admin download routes (original WSI, slide export bundle, backup
# archive; see wsi-locations.conf) accept a signed token in the query string,
# `?t=<jwt>`, because the SPA starts a download as a plain link the browser
# navigates to, with no Authorization header. A token is good for an hour and
# can hand out a whole-install backup, yet the stock "combined" access log
# writes $request, query string and all, to /var/log/nginx/access.log, which
# the adm group can read and which often gets shipped to a log collector.
# $wsi_log_request is $request with the query of a download route that carries
# a t= replaced by "t=[redacted]"; every other request line is left
# byte-for-byte as is. wsi_combined is "combined" with that in place of
# $request, so the log keeps its layout for anything that parses it. The
# server block below logs with it (by default: wsi-access-log.conf).
#
# The key is matched as t= or %74= too: the app percent-decodes query keys,
# so `?%74=<jwt>` authenticates exactly like `?t=<jwt>`, and would otherwise
# be logged in clear. %74 is the only other spelling (hex digits have no case;
# a %-escape of the '=' makes the key something else). Not covered: a
# download path itself spelled with escapes (.../%64ownload), which nginx and
# the app route but this match does not recognise. The SPA sends neither;
# they matter only for a hand-made link.
#
# Not covered, because nginx's error log has a fixed layout: an error while
# serving such a request (an upstream timeout or reset mid-download, a
# limit_req refusal) is logged with the request line, token included. Those
# are rare and the token expires within the hour. The app's own request log
# (uvicorn, in the journal) masks it itself (wsi_app.main).
map $request $wsi_log_request {
    default                                                                          $request;
    "~^(\S+ /api/admin/(?:slides|backup)/[^?\s]*/download\?)(?:\S*&)?(?:t|%74)=\S*(\s.*)?$"  "$1t=[redacted]$2";
}

log_format wsi_combined '$remote_addr - $remote_user [$time_local] '
                        '"$wsi_log_request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# Authorization headers that keep a request OUT of the shared caches (see the
# proxy_cache_bypass / proxy_no_cache lines in wsi-locations.conf). A staff
# Bearer unlocks draft previews, so its responses must never be shared; any
# unrecognised scheme is treated the same way. HTTP Basic (app-access "basic"
# mode) only ever reaches published content, the same bytes a cookie user gets,
# so it does not bypass: a browser that answered the Basic dialog re-sends
# the header on every tile and would otherwise never get a cache HIT.
map $http_authorization $wsi_auth_nocache {
    default         1;
    ""              "";
    "~*^Basic\s"    "";
}

# The /_wsi_authz verdict is keyed on the session cookie, so only a verdict
# the cookie alone earned may be cached. A request carrying ANY Authorization
# header is never cached: without a cookie a Basic client's 204 would land on
# the shared empty-cookie key (another cookie-less client behind the same IP
# would inherit it), and with one the 204 may have been earned by the header
# while the cookie is junk or planted — a later cookie-only request replaying
# that value would ride the cached allow. The app answers such a request from
# its cheap cookie branch whenever the cookie is valid, so this costs a JWT
# decode per edge check, not a pbkdf2 verify.
map $http_authorization $wsi_authz_nocache {
    default     1;
    ""          "";
}

# The slide a /_wsi_authz verdict is for, folded into that verdict's cache key
# (wsi-locations.conf) so an allow earned for one slide is never reused for
# another — /api/edge-authz checks each /dzi/ slide's publish state, so the
# verdict differs per slide. "dzi:<public_id>" for a /dzi/ tile / descriptor /
# archive URI, "" for every other gated surface (/thumbs/, /assets/), which
# keep one app-access verdict per client.
#
# Keyed on $request_uri, NOT $uri: inside the auth subrequest $uri is
# "/_wsi_authz", while $request_uri is still the client's original URI — the
# same string the app parses (it arrives as X-Original-URI), with the same
# expression (dzi.edge_slide_access), so nginx and the app always agree on the
# slide. $request_uri is raw, but the /dzi/ locations 400 any path with "//", a
# dot segment or a "%" before auth runs, so for every /dzi/ request reaching
# this point the raw path IS the normalised $uri the tile cache keys on. A
# /dzi/ URI that does not parse gets a key of its own ("dzi:?"): the app denies
# it, so that key never holds an allow, and it cannot ride the "" verdict.
map $request_uri $wsi_authz_object {
    default                                                              "";
    "~^/dzi/(?<wsi_authz_slide>[A-Za-z0-9_-]{1,64})(_files/|\.(dzi|szi)(\?|$))"  "dzi:$wsi_authz_slide";
    "~^/dzi/"                                                            "dzi:?";
}

# Set (to 1) when a /dzi/ request carries no tile-generation ?v= (or an empty
# one) — i.e. a script or other non-SPA caller. Such a response
# is still served but kept out of the shared cache (proxy_cache_bypass /
# proxy_no_cache in the /dzi/ and .dzi locations): its key could otherwise
# hold any generation's bytes. The app also marks it X-Accel-Expires: 0.
map $arg_v $wsi_dzi_unversioned {
    ""          1;
    default     "";
}

# Key of the wsi_dzi_uncached zone (below): the client for a /dzi/ request with
# no ?v= — one the shared cache never answers, so it reaches the app every
# time — and "" for every versioned one. limit_req does not count a request
# whose key is empty, so this meters exactly the uncacheable requests and
# leaves every current viewer (cache HIT or cold MISS) untouched.
map $wsi_dzi_unversioned $wsi_dzi_uncached_key {
    1           $wsi_rl_key;
    default     "";
}

# Key of the wsi_dzi_authed zone (below): the client for a /dzi/ request that
# carries an Authorization header other than HTTP Basic — a staff Bearer, or
# anything that merely says it is one — and "" for every other. Such a request
# is kept out of the shared cache in both directions ($wsi_auth_nocache), so a
# tile is rendered for it every time whether or not the token is any good:
# nginx cannot tell, and the app only finds out after the request is admitted.
map $wsi_auth_nocache $wsi_dzi_authed_key {
    ""          "";
    default     $wsi_rl_key;
}

# Cache-Control the browser gets for a Deep Zoom tile (the /dzi/ location; the
# nested .dzi / .szi locations keep the app's own no-cache). A tile URL that
# carries the slide's current generation (?v=N) names bytes that never change
# — a replace mints a new N (so does a DZI_TILE_SIZE / DZI_OVERLAP change, for
# every slide: dzi.reconcile_tile_geometry) and the app 404s any other v — so
# a 200 or 304 for
# it may be reused by that browser for a day without asking again: redrawing a
# tile OpenSeadragon evicted from memory then costs no round trip (it cost one
# conditional request per tile under no-cache; see docs/developer-guide.md
# "Viewer rendering tuning"). `private` keeps it out of shared caches, so a
# CDN in front never hands an access-gated tile to someone else. The price:
# for up to a day a browser may redraw a tile it already holds without the
# edge re-checking access. A slide unpublished meanwhile still can't be
# reopened (its descriptor stays no-cache), but tiles already seen stay in that
# browser's cache. Anything else — no ?v=, an error — stays no-cache. The app
# itself sends no-cache on every tile and nginx stores that header with each
# cached tile, so the policy lives here alone: rolling this config back rolls
# it back for tiles already in the cache too.
map "$status:$wsi_dzi_unversioned" $wsi_dzi_tile_cache_control {
    "~^(200|304):$"     "private, max-age=86400";
    default             "no-cache";
}

# Brute-force protection for the admin login endpoint (10 req/min/IP, burst 5).
limit_req_zone $wsi_rl_key zone=wsi_admin_login:10m rate=10r/m;
# Same treatment for the app-access login endpoint (LDAP / basic): without a
# dedicated zone it inherits the generic /api/ limit, which is too
# generous for a credential-checking endpoint subject to password spraying.
# Mirrors wsi_admin_login so an operator who tightens one side automatically
# gets the other.
limit_req_zone $wsi_rl_key zone=wsi_app_login:10m rate=10r/m;
# The same two endpoints per IPv6 /64 ($wsi_rl_net64; empty — not counted —
# for IPv4), applied on top of the per-address zones above. Without them an
# IPv6 client rotates through its /64 and every new address starts with a
# fresh 10 r/min. Not simply the per-address zones re-keyed on the /64: a /64
# is also a whole LAN segment, and on a campus Wi-Fi each student has an
# address of their own in one /64, so a class logging in at the start of a
# lesson must fit (the burst in wsi-locations.conf: 100 app logins, 10
# dashboard logins at once), while a client that rotates is held to 120 /
# 30 per minute in all instead of 10 per address. The other zones stay
# per address: they meter browsing, not guessing, and are not sized for a
# whole segment. (The app's own failed-login throttle is the guess counter.)
limit_req_zone $wsi_rl_net64 zone=wsi_admin_login_net:10m rate=30r/m;
limit_req_zone $wsi_rl_net64 zone=wsi_app_login_net:10m rate=120r/m;
# General API rate limit (120 req/min/IP, burst 40 on the interactive /api/
# and /api/admin/ locations) applied to all /api/ routes except the two login
# locations, which have their own stricter zones above. A single public page
# load fires several /api/ requests at once (slide list, facets, tours, viewer
# settings, auth state, analytics beacon), so the limit is sized for a human
# reloading and browsing — not just one request per page. The login zones stay
# at the tight 10 r/min so relaxing general browsing never loosens brute-force
# protection. Public tile/thumbnail traffic (/dzi/, /thumbs/, /assets/) is not
# in this zone at all (unversioned /dzi/ requests have wsi_dzi_uncached below).
limit_req_zone $wsi_rl_key zone=wsi_api:10m rate=120r/m;
# Live-sync WebSocket upgrades (/api/sync/ws/, /api/sync/discovery). Not in
# wsi_api: a class behind one NAT address — a campus network, or every student
# reaching a Cloudflare tunnel through the same egress — is one key here, and
# the live-sync capacity limits are deliberately sized to admit such a class
# (200 followers per room by default). When wsi-sync restarts, or the network
# blips, every follower and index-page discovery socket reconnects at once
# (backoff from 0.5 s, jittered, capped at 30 s). burst=400 on the two
# locations lets 200 followers plus 200 discovery sockets back in from one
# address in one go when their first attempt finds the server up. During a
# longer outage the failed attempts count against the zone too and soon use
# up the burst, so the class comes back at the rate, 600 r/min (10 r/s): that
# covers the retries of ~300 sockets at the 30 s cap, not all 400 (~13 r/s,
# 800 r/min), so a socket answered 429 retries at its next backoff step and
# the last are back within about a minute. Still a hard ceiling per address
# on the single sync worker, which pays a threadpool slot and up to three
# auth checks per upgrade.
limit_req_zone $wsi_rl_key zone=wsi_sync_ws:10m rate=600r/m;
# The slide detail read, GET /api/slides/<public_id> (wsi-locations.conf's
# nested location under `^~ /api/slides/`). Every live-sync follower fetches it
# the instant the presenter switches slides, so a class behind one NAT address
# sends a whole room's worth at once — in wsi_api (burst 40) all but the first
# 40 get a 429 and are left without the slide. Sized like wsi_sync_ws for the
# same class (200 followers per room by default): one switch fits in the burst,
# and back-to-back switches refill at 10 r/s. A cheap indexed read by an
# unguessable token; the rest of /api/slides/ stays in wsi_api. Nothing else
# shares this zone: each follower sends the slide read AND the two small page
# reads below on a switch or a join, and one zone for all of them would use up
# the burst on the small reads, leaving a third to half of the slide reads with
# a 429 (a follower that is refused one has no slide until its retry).
limit_req_zone $wsi_rl_key zone=wsi_slide_detail:10m rate=600r/m;
# What a visitor's browser reads to open a page: the public tour read (GET
# /api/tours/<public_id>, which the tour page does not retry) and the two small
# reads every public page makes first (GET /api/auth/state, GET
# /api/viewer/settings). A class opening one tour link at the start of a lesson
# is that many students x those three requests at the same instant; a live-sync
# room switching slides is its followers x the settings read, and one joining is
# its followers x the sign-in state and settings reads: 400 for 200 followers,
# which the burst of 400 on the location holds (the base rate refills 10 r/s).
# Its own zone, so these never spend the slide detail's burst
# (see wsi-locations.conf).
limit_req_zone $wsi_rl_key zone=wsi_page_reads:10m rate=600r/m;
# The live-sync session peek, GET /api/sync/sessions/<sid> (wsi-locations.conf's
# nested location under `^~ /api/sync/`). Every follower sends it once, as it
# opens the presenter's link — a class scanning the QR code together, behind
# one NAT address, at the same moment — and in wsi_api (burst 40) the rest
# would get a 429. Sized like
# wsi_slide_detail (the follower's next request), in a zone of its own so the
# two reads of one join do not share a burst. A dictionary lookup and one
# indexed read by an unguessable id; the rest of /api/sync/ stays in wsi_api.
limit_req_zone $wsi_rl_key zone=wsi_sync_peek:10m rate=600r/m;
# SPA fallback (`location /`). Every path that isn't /api/, /dzi/, /thumbs/ or
# /assets/ lands there and is proxied to the app, so without a zone a flood of
# nonexistent paths — a crawler, a scanner — reaches uvicorn unmetered and can
# saturate the workers ahead of the rate-limited /api/ routes. Sized far above
# the API zone on purpose: this location also serves the SPA's own bundles and
# fonts, so a cold page load legitimately fires dozens of requests at once and
# a tight limit here would break normal browsing rather than abuse.
limit_req_zone $wsi_rl_key zone=wsi_spa:10m rate=600r/m;
# Deep Zoom requests that carry no ?v= (the /dzi/ location and its nested .dzi
# / .szi ones). /dzi/, /thumbs/ and /assets/ are otherwise unmetered, and a
# per-client zone over all their traffic would be wrong twice over: limit_req
# runs before the cache lookup, so it would count every cache HIT, and a class
# behind one NAT address is one key (a class of 100+ students opening a slide at once are
# tens of thousands of tile requests in seconds; an iPad screen alone is
# 90-280 tiles). An unversioned request is the one kind known up front to reach
# the app every time — kept out of the cache by $wsi_dzi_unversioned — and on a
# slide without a pyramid one low-zoom tile can mean reading the whole
# multi-GB image, so nothing else bounds how often one client could make the
# app do that. Only a script or other non-SPA caller (or a crafted request)
# sends these, so the zone can be modest: 10 r/s, with the burst / delay in
# wsi-locations.conf letting such a caller still fetch a screenful.
# ($wsi_dzi_uncached_key is empty — not counted — for every versioned request.)
# What this does NOT meter: an edge-authz probe that misses its cached verdict
# (a junk cookie, a made-up slide id; denials are not cached) costs an app
# request too, but before the lookup it looks exactly like one that hits, and
# it costs a token decode and an in-memory slide lookup, not a render.
limit_req_zone $wsi_dzi_uncached_key zone=wsi_dzi_uncached:10m rate=600r/m;
# /dzi/ requests that bypass the cache because they carry an Authorization
# header (see $wsi_dzi_authed_key). wsi_dzi_uncached above meters only the
# unversioned ones, so `GET /dzi/<id>_files/13/21_17.jpeg?v=<current>` with a
# junk `Authorization: Bearer x` in a loop would take the cache bypass, skip that
# zone, and make the app open the slide, read, encode and answer a tile every
# time. 50 r/s per client with a burst of 600 (wsi-locations.conf) is far above
# what staff panning a slide send; students do not carry the header and are
# not counted, so a class behind one address is unaffected. (A request that
# carries a Cloudflare Access JWT instead is not metered here: under Access
# every user does, and a campus shares one egress address.)
limit_req_zone $wsi_dzi_authed_key zone=wsi_dzi_authed:10m rate=3000r/m;

upstream wsi_app { server 127.0.0.1:8000; keepalive 32; }

# The live-sync coordinator runs as a separate single-worker uvicorn
# (wsi-sync.service) so the in-memory RoomManager stays coherent. nginx
# routes every /api/sync/* and /api/admin/sync/* request — REST plus the
# WebSocket upgrades — to it; everything else stays on wsi_app, which
# keeps its multi-worker scaling for DZI tile traffic.
upstream wsi_sync { server 127.0.0.1:8001; keepalive 8; }

# Required for "proxy_set_header Connection $connection_upgrade" on the
# sync WebSocket location below. A non-upgrade request maps to "" (not
# "close") so it can reuse the upstream keepalive pool; every other proxied
# location clears Connection explicitly for the same reason.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The operator's TLS settings (listen 443 ssl, the certificate, HSTS, an
    # http -> https redirect): a file of their own, which install.sh / update.sh
    # create when missing and never overwrite (unlike this file, which they
    # replace each run, so certbot's edits to it, or an HSTS line here, would go
    # with every update). A site file certbot had patched is migrated into it
    # on the next run (infra/lib/nginx_tls_carry.py). Shipped as
    # infra/nginx/wsi-tls.conf.
    include /etc/nginx/snippets/wsi-tls.conf;

    # Conservative global limit; the locations in wsi-locations.conf that take
    # larger bodies (slide upload / replace, restore, import, tour assets,
    # branding images, tour step writes) raise it for themselves.
    client_max_body_size 2m;
    # Tight client-side timeout for the default request profile (small JSON
    # bodies). The slide-upload endpoint widens this explicitly because a
    # multi-GB SVS over a slow link legitimately needs minutes; everything
    # else should not be holding a connection open for 10 minutes (slow-
    # loris hardening).
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Don't advertise the nginx version in the Server header or on nginx's own
    # error pages (413 / 429 / 502 ...) — it only helps a scanner match CVEs.
    server_tokens off;

    # The access log. The included file holds, by default, the stock access
    # log in the stock "combined" layout minus the download tokens
    # (`access_log /var/log/nginx/access.log wsi_combined;`, see
    # $wsi_log_request / wsi_combined above). Any access_log there replaces
    # the one this site would inherit from nginx.conf — which on Ubuntu is
    # that same file, but on a host whose operator set `access_log off;` or a
    # JSON / syslog log there it is not. So it is a file of its own that
    # install.sh creates only when it is missing (from
    # infra/nginx/wsi-access-log.conf) and never overwrites: an operator
    # keeps their own logging by editing it, and it survives every update,
    # while this site file is replaced each time. Here, not in
    # wsi-locations.conf: a log path in that snippet would be opened by every
    # `nginx -t` that includes it, which fails for anyone who cannot write
    # /var/log/nginx. A second server block that includes the locations
    # snippet should include this one too.
    include /etc/nginx/snippets/wsi-access-log.conf;

    # ---- Security response headers (apply to every response) ----
    # Strict-Transport-Security is intentionally omitted here: it belongs in the
    # TLS snippet above (wsi-tls.conf), once TLS is in front, so browsers don't
    # pin a non-HTTPS host -- and so an update does not revert it.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: OpenSeadragon + the SPA need inline styles and blob/data images.
    # The viewer's UI sprites (zoom in/out, home, fullPage, rotate) are served
    # from this origin — they are vendored under frontend/public/osd-images/ —
    # so img-src needs no third-party origin for them (the Google hosts in it
    # are for the optional GA4 tag, see below). Vendored locally so the controls
    # keep working on isolated LANs without Internet access
    # (a CDN origin would leave them blank offline).
    #
    # style-src carries 'unsafe-inline' as an explicit, accepted release
    # decision (see docs/operations.md → "Content-Security-Policy"):
    #   - OpenSeadragon writes inline `style=` on its canvas overlay container
    #     (third-party code that is not under this project's control)
    #   - Pin / shape helpers (frontend/src/lib/tourPins.ts, tourShapes.ts)
    #     set inline styles dynamically as part of viewport placement
    #   - React's `style` prop emits inline styles, which the SPA uses widely
    # Removing it requires migrating these callers to CSS classes plus a
    # request-scoped nonce, which is a non-trivial refactor, so the header is
    # accepted as-is. The residual risk is bounded because script-src
    # remains restrictive ('self' + the GTM origin only) and frame-ancestors
    # is 'none' — a style-only injection cannot execute JS or be framed.
    # Do not advertise script-src 'unsafe-inline' here under any
    # circumstances — the GA loader in App.tsx is intentionally written so
    # it does not require it.
    #
    # The Google hosts serve one optional feature, the GA4 tag an admin can
    # enable (Network -> Google Analytics): script-src the gtag.js loader
    # (App.tsx loads it from www.googletagmanager.com only), connect-src /
    # img-src what Google documents for GA4 — beacons go to regional hosts
    # such as region1.google-analytics.com / region1.analytics.google.com,
    # hence the wildcards. Nothing else uses them, and with no measurement ID
    # configured (the default) none of them is ever contacted.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Optional TLS redirect (enable after you install certs) ----
    # return 301 https://$host$request_uri;

    # ---- Route map: all proxied locations live in a reusable snippet ----
    # The `location` blocks are kept in a separate file so a second server
    # block (e.g. a TLS vhost) can reuse the exact same routing with one
    # `include`, instead of copy/pasting hundreds of lines. The snippet
    # depends on the http-context upstreams, rate-limit zones, cache path,
    # and map/geo vars declared above; keep those in sync if you reuse it.
    include /etc/nginx/snippets/wsi-locations.conf;
}
