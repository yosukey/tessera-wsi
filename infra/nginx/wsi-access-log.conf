# The WSI site's access log: included by the server block of
# /etc/nginx/sites-available/wsi (infra/nginx/wsi.conf) as
# /etc/nginx/snippets/wsi-access-log.conf.
#
# install.sh copies this file there only when nothing is there yet and never
# overwrites it, so the installed copy is yours to edit and survives every
# update (unlike the site config and wsi-locations.conf, which each install
# replaces). An `access_log` here replaces the one the site would inherit
# from nginx.conf's http block. Some choices (docs/operations.md, "nginx
# access log"):
#
#   access_log off;                                     # no access log
#   access_log syslog:server=unix:/dev/log wsi_combined; # to syslog
#   access_log /var/log/nginx/wsi.json my_json_format;  # your own format
#
# A format of your own should log $wsi_log_request, not $request: it is the
# request line with the one-hour download token (`?t=`) of the admin
# download routes masked, which $request would write in clear. A line
# referring to a format nginx does not know fails `nginx -t`, which makes
# install.sh / update.sh stop and put the previous config back.
access_log /var/log/nginx/access.log wsi_combined;
