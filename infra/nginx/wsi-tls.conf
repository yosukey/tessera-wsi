# TLS settings for the wsi site. This file is YOURS: install.sh and update.sh
# create it when it is missing and never overwrite it, although they replace
# the site file (/etc/nginx/sites-available/wsi) on every run -- which is why
# the TLS settings live here and not in that file. The site's server block
# includes it, so everything below is read inside `server { ... }`.
#
# A site file that `certbot --nginx` had already patched is migrated into this
# file by the next install.sh / update.sh (the lines certbot marked
# "managed by Certbot", the domain, an uncommented HSTS header, certbot's
# http -> https redirect), so there is nothing to redo after an update.
#
# By hand, with a certificate you already have (for example from
# `certbot certonly`), uncomment and adapt:
#
#server_name wsi.example.org;
#listen 443 ssl;
#listen [::]:443 ssl;
#ssl_certificate     /etc/letsencrypt/live/wsi.example.org/fullchain.pem;
#ssl_certificate_key /etc/letsencrypt/live/wsi.example.org/privkey.pem;
#include /etc/letsencrypt/options-ssl-nginx.conf;
#
# Only once HTTPS works for good (browsers remember it for a year):
#add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Send this name's plain-HTTP visitors to HTTPS. By host, not for every
# request: the raw-IP break-glass route (WSI_BREAKGLASS_NOAUTH) is plain HTTP
# on purpose. And only for plain HTTP: this block listens on 443 as well, so
# `if ($host = ...)` alone would send HTTPS requests to themselves, forever.
# $wsi_xfp is the scheme the visitor used (see wsi.conf).
#set $wsi_tls_redirect "$wsi_xfp:$host";
#if ($wsi_tls_redirect = "http:wsi.example.org") { return 301 https://$host$request_uri; }
